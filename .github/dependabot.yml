# Dependabot opens pull requests for dependency updates; CI (lockfile check, type check, tests,
# dry-run bundle) runs on each one, so a broken update shows up red before anything is merged.
# Nothing is merged or deployed automatically.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # agents pins exact @modelcontextprotocol/server and /client versions as peer dependencies,
      # so these must move together.
      mcp-and-agents:
        patterns: ["agents", "@modelcontextprotocol/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      dev-tools:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # MCP SDK 2.x is a different API (the server uses 1.x with McpAgent); upgrade by hand.
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types: ["version-update:semver-major"]
      # The types follow the oldest Node.js the project supports (engines: >=22.12), so code can't
      # use newer Node APIs by accident. Move this up only when the minimum Node version goes up.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
